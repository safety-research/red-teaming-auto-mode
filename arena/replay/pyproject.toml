[project]
name = "replay"
version = "0.0.0"
description = "The replay driver: score frozen transcripts through MonitorKit, and search over the parts of a transcript an attacker controls."
readme = "README.md"
requires-python = ">=3.12"
# MonitorKit and nothing else. Replay is offline by construction (Kind.OFFLINE_REPLAY,
# rollout/src/rollout/envspec.py:31-35): no Docker, no sandbox, no Inspect. Do NOT copy
# rollout's inspect-ai dependency — the whole point of this package is that it is light.
dependencies = [
    "monitorkit",
    # MonitorKit keeps the SDK OUT of its dependencies on purpose — it imports lazily, so an
    # installation that never builds a provider never needs it. replay is a DRIVER and does build
    # one, so it declares it here rather than relying on the library's test group being present.
    # The offline suite still never imports it: only the scripts do.
    "anthropic>=0.40",
]

[dependency-groups]
# `plot` is included in `dev` on purpose. The figure tier (replay/figures/) is now a
# deliverable of this package, and its regression oracle is a BYTE comparison against the
# committed PNGs -- a test that silently skips when matplotlib is absent would prove
# nothing, which is the failure mode docs/ROLLOUT-REBUILD.md §0 is written about.
# pytest-xdist: `./check` fans this suite across cores (see its check_replay). Safe because no
# test shares mutable state; a bare `pytest` still runs serial.
dev = ["pytest>=8.3.0", "pytest-xdist>=3.6", "ruff>=0.7.0", {include-group = "plot"}]
# matplotlib is the ONLY thing the figures need and nothing else in the package imports it,
# so it stays out of the RUNTIME dependencies: an offline scoring run should not drag a
# plotting stack behind it.
#
# PINNED EXACTLY, not floated. A PNG's bytes are a function of the renderer, so
# `matplotlib>=3.9` would make tests/test_figures.py go red on a resolver bump for a
# reason that has nothing to do with the numbers. 3.11.1 is the version that produced the
# committed figures and the published ones (D-78).
plot = ["matplotlib==3.11.1"]

[tool.uv.sources]
# MonitorKit is the pinned `../monitorkit` submodule of this repo — the exact reviewed revision
# is recorded in the gitlink (M-1). Editable so a submodule bump is picked up without re-sync.
#
# This path dep is the ONLY way replay resolves MonitorKit. Do not add a sys.path.insert to a
# sibling checkout the way an env-materialize test would — that imports a
# working tree instead of the pin, which defeats the one fact this repository is built around.
monitorkit = { path = "../monitorkit", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/replay"]

[tool.ruff]
line-length = 100

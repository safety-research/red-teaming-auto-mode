repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        # kept .eval fixtures for grader validation exceed 1MB (agent transcripts); whitelist them
        exclude: 'grader_validation/.*\.eval$'
  # Markdown lint — scoped to the package README for now; widen `files` as docs are cleaned up.
  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.41
    hooks:
      - id: rumdl
        files: ^pkgs/auto_mode_eval/README\.md$
        args: ["--config", "pkgs/auto_mode_eval/.rumdl.toml"]
